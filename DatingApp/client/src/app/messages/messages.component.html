<div class="row mb-4">
    <div class="btn-group" role="group">
        <input type="radio" class="btn-check" name="container" id="unread" value="Unread" [(ngModel)]="container" (ngModelChange)="loadMessages()">
        <label class="btn btn-primary" for="unread">
            <i class="fa fa-envelope"></i> Unread
        </label>
        
        <input type="radio" class="btn-check" name="container" id="inbox" value="Inbox" [(ngModel)]="container" (ngModelChange)="loadMessages()">
        <label class="btn btn-primary" for="inbox">
            <i class="fa fa-envelope-open"></i> Inbox
        </label>
        
        <input type="radio" class="btn-check" name="container" id="outbox" value="Outbox" [(ngModel)]="container" (ngModelChange)="loadMessages()">
        <label class="btn btn-primary" for="outbox">
            <i class="fa fa-paper-plane"></i> Outbox
        </label>
    </div>
</div>

<div class="row" *ngIf="messages?.length === 0">
    <h3>No messages</h3>
</div>

<div class="row" *ngIf="messages.length > 0">
    <table class="table table-hover" style="cursor: pointer;">
        <tr>
            <th style="width: 40;">Message</th>
            <th style="width: 20;">From / To</th>
            <th style="width: 20;">Sent / Received</th>
            <th style="width: 20;">Message</th>
        </tr>
        <tr [hidden]="loading" *ngFor="let message of messages"
            routerLink='{{container === "Outbox" 
                            ? "/members/" + message.recipientUsername 
                            : "/members/" + message.senderUsername}}' [queryParams]="{tab: 3}" >
            <td>{{message.content}}</td>
            <td>
                <div class="" *ngIf="container === 'Outbox'">
                    <img class="img-circle rounded-circle me-2"
                        src="{{message.recipientPhotoUrl || './assets/user.png'}}" alt="{{message.recipientUsername}}" srcset="">
                    <strong>{{message.recipientUsername | titlecase}}</strong>
                </div>
                <div class="" *ngIf="container !== 'Outbox'">
                    <img class="img-circle rounded-circle me-2"
                        src="{{message.senderPhotoUrl || './assets/user.png'}}" alt="{{message.senderUsername}}" srcset="">
                    <strong>{{message.senderUsername | titlecase}}</strong>
                </div>
            </td>
            <td>{{ message.messageSent | timeago}}</td>
            <td>
                <button (click)="$event.stopPropagation()"  (click)="deleteMessage(message.id)" class="btn btn-danger">Delete</button>
            </td>
        </tr>
    </table>
</div>
<div class="d-flex justify-content-center" *ngIf="pagination && !loading">
  <!-- <ngb-pagination [collectionSize]="70" [(page)]="2" [boundaryLinks]="true"></ngb-pagination> -->
  <nav aria-label="Page navigation">
    <ngb-pagination [collectionSize]="pagination.totalItems" [(page)]="pagination.currentPage"
      (pageChange)="pageChanged($event)" [pageSize]="pageSize" [maxSize]="pagination.itemsPerPage"
      [boundaryLinks]="true" [rotate]="true">
    </ngb-pagination>
  </nav>

</div>
