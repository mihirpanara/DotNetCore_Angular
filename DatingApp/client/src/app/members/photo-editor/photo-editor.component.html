<div class="row">
    <div class="col-2" *ngFor="let photo of member?.photos">
        <img src="{{photo?.url}}" alt="{{photo?.url}}" class="img-thumbnail p-1">
        <div class="text-center">
            <button
            [disabled]="photo.isMain"
            (click)="setMainPhoto(photo)"
            [ngClass]="photo.isMain ? 'btn-success' : 'btn-outline-success'"
            class="btn btn-sm">Main</button>

            <button class="btn btn-sm btn-danger"
            [disabled]="photo.isMain"
            (click)="deletePhoto(photo)"
            >
                <i class="fa fa-trash"></i>
            </button>
        </div>
    </div>
</div>

<div class="row mt-5">
  <div class="col-md-3">
    <h3>Select files</h3>

    <ngx-file-drop
      dropZoneLabel="Base drop zone"
      [showBrowseBtn]="true"
      browseBtnLabel="Browse"
      (onFileDrop)="onFileDropped($event)"
      (onFileOver)="fileOverBase(true)"
      (onFileLeave)="fileOverBase(false)"
      [dropZoneClassName]="hasBaseDropZoneOver ? 'nv-file-over' : 'my-drop-zone'"
      class="well my-drop-zone">
    </ngx-file-drop>

    <ngx-file-drop
      dropZoneLabel="Another drop zone"
      [showBrowseBtn]="true"
      browseBtnLabel="Browse"
      (onFileDrop)="onFileDroppedAnother($event)"
      (onFileOver)="fileOverAnother(true)"
      (onFileLeave)="fileOverAnother(false)"
      [dropZoneClassName]="hasAnotherDropZoneOver ? 'another-file-over-class' : 'my-drop-zone'"
      class="well my-drop-zone">
    </ngx-file-drop>
  </div>

  <div class="col-md-9" style="margin-bottom: 40px">
    <h3>Upload queue</h3>
    <p>Queue length: {{ files.length }}</p>

    <table class="table">
      <thead>
        <tr>
          <th width="50%">Name</th>
          <th>Size</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let file of files; let i = index">
          <td><strong>{{ file.fileEntry.name }}</strong></td>
          <td>--</td>
          <td>
            <button class="btn btn-success btn-xs" (click)="uploadFile(file)">
              <span class="glyphicon glyphicon-upload"></span> Upload
            </button>
            <button class="btn btn-danger btn-xs" (click)="removeFile(i)">
              <span class="glyphicon glyphicon-trash"></span> Remove
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div>
      <button type="button" class="btn btn-success btn-s" (click)="uploadAll()" [disabled]="files.length === 0">
        <span class="glyphicon glyphicon-upload"></span> Upload all
      </button>
      <button type="button" class="btn btn-danger btn-s" (click)="clearQueue()" [disabled]="files.length === 0">
        <span class="glyphicon glyphicon-trash"></span> Remove all
      </button>
    </div>
  </div>
</div>
