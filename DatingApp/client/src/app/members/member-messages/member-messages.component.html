<div class="card">
    <div class="card-body">
        <div *ngIf="!messages || messages.length === 0">
            No messages yet... say hi by using the message box below
        </div>
    
        <ul *ngIf="messages && messages.length > 0" class="chat">
            <li *ngFor="let message of messages" >
                <div class="d-flex justify-content-between">
                    
                    <div class="chat-body">
                        <div class="header">
                            <small class="text-muted">
                                <span class="fa fa-clock-o">{{ message?.messageSent | timeago }}</span>
                                <span class="text-danger" *ngIf="!message.dateRead "> <!-- && message.senderUsername !== username -->
                                    (unread)
                                </span>
                                <span class="text-success" *ngIf="message.dateRead "> <!-- && message.senderUsername !== username -->
                                    (read {{ message?.dateRead | timeago }})
                                </span>
                            </small>
                        </div>
                        <p>{{ message.content }}</p>
                    </div>
                    <span class="chat-img text-end">
                        <img class="rounded-circle" [src]="message.senderPhotoUrl || './assets/user.png'"
                            [alt]="message.senderUsername">
                    </span>
                </div>
            </li>
        </ul>
    </div>
    
    <div class="card-footer">
      <form #messageForm="ngForm" (ngSubmit)="sendMessage()" autocomplete="off">
        <div class="input-group">
          <input 
            name="messageContent"
            [(ngModel)]="messageContent"
            required
            type="text" class="form-control input-sm" placeholder="Send a private message">
          <div class="input-group-append">
            <button [disabled]="messageForm.invalid" [disabled] class="btn btn-primary" type="submit">
              <i class="fa fa-send"></i> </button>
          </div>
        </div>
      </form>
    </div>
</div>
