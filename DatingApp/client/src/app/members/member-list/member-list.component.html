<div class="text-center mt-3">
  <h2>Your matches - {{pagination?.totalItems}}</h2>
</div>
<div class="container mt-3">
  <form #form="ngForm" class="d-flex form-inline mb-3" (ngSubmit)="loadMembers()" autocomplete="off">
    <div class="form-group d-flex">
      <label for="">Age From:</label>
      <input type="number" class="form-control ms-1" style="width: 70px;" name="minAge" [(ngModel)]="userParams.minAge">
    </div>

    <div class="form-group d-flex ms-2">
      <label for="">Age to:</label>
      <input type="number" class="form-control ms-1" style="width: 70px;" name="maxAge" [(ngModel)]="userParams.maxAge">
    </div>

    <div class="form-group d-flex ms-2 px-2">
      <label for="">Show: </label>
      <select name="gender" style="width: 130px;" [(ngModel)]="userParams.gender" class="form-control ms-1" id="">
        <option *ngFor="let gender of genderList" [value]="gender.value">
          {{gender.display}}
        </option>
      </select>
    </div>

    <button class="btn btn-primary ms-1" type="submit">Apply Filters</button>
    <button class="btn btn-info ms-1" (click)="resetFilters()" type="submit">Reset Filters</button>

    <div class="btn-group float-right">
      <button 
        type="button"
        class="ms-2 btn btn-primary" 
        name="orderBy" 
        (click)="loadMembers()" 
        btnRadio="lastActive"
        [(ngModel)]="userParams.orderBy">Last Active</button>
      
      <button 
        type="button"
        class="ms-2 btn btn-primary" 
        name="orderBy" 
        (click)="loadMembers()" 
        btnRadio="created"
        [(ngModel)]="userParams.orderBy">Newest Members</button>

    </div>
  </form>
</div>

<div class="row">
  <div *ngFor="let member of members" class="col-2">
    <app-member-card [member]="member"></app-member-card>
  </div>
</div>

<div class="d-flex justify-content-center" *ngIf="pagination">
  <!-- <ngb-pagination [collectionSize]="70" [(page)]="2" [boundaryLinks]="true"></ngb-pagination> -->
  <nav aria-label="Page navigation">
    <ngb-pagination [collectionSize]="pagination.totalItems" [(page)]="pagination.currentPage"
      (pageChange)="pageChanged($event)" [pageSize]="userParams.pageSize" [maxSize]="pagination.itemsPerPage"
      [boundaryLinks]="true" [rotate]="true">
    </ngb-pagination>
  </nav>

</div>
